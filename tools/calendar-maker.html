<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>営業カレンダー作成ツール | healing salon Holly</title>
<style>
  :root { --purple: #C5B3D3; --closed: #DBD0E6; --ink: #222; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1rem 1rem 4rem; background: #F8F5F7; color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; line-height: 1.7;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  .lead { margin: 0 0 1.25rem; color: #555; font-size: .95rem; }
  .step { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  .step h2 { font-size: 1.05rem; margin: 0 0 .5rem; }
  label { display: block; font-weight: 700; margin-bottom: .25rem; }
  input[type="month"], input[type="text"] {
    width: 100%; font-size: 1.1rem; padding: .6rem .7rem; border: 1px solid #bbb; border-radius: 8px; background: #fff;
  }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; }
  button {
    font: inherit; font-size: 1rem; padding: .7rem 1rem; border-radius: 999px; border: 1px solid #8f7aa6;
    background: #fff; cursor: pointer;
  }
  button.primary { background: var(--purple); border-color: #a58fbd; font-weight: 700; }
  button:active { transform: translateY(1px); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: .75rem; }
  .grid .wd { text-align: center; font-weight: 700; padding: .25rem 0; }
  .grid .wd.sat { color: #2F5DA8; } .grid .wd.sun { color: #B33A3A; }
  .grid .blank { visibility: hidden; }
  .day {
    min-height: 56px; padding: .25rem 0; border: 1px solid #ccc; border-radius: 8px; background: #fff;
    font-size: 1.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .day small { font-size: .7rem; color: #6B4FA0; height: 1em; }
  .day[aria-pressed="true"] { background: var(--closed); border-color: #a58fbd; color: #4A2D82; font-weight: 700; }
  .count { margin: .75rem 0 0; font-size: .95rem; color: #555; }
  textarea {
    width: 100%; min-height: 4.5rem; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem;
    padding: .6rem; border: 1px solid #bbb; border-radius: 8px; background: #fafafa;
  }
  canvas { width: 100%; height: auto; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
  .hint { font-size: .85rem; color: #666; margin: .4rem 0 0; }
</style>
</head>
<body>
<main>
  <h1>営業カレンダー作成ツール</h1>
  <p class="lead">休みの日をタップするだけで、<b>Instagram用の画像</b>と<b>ホームページ用のデータ</b>を同時に作れます。インターネット接続は不要です。</p>

  <section class="step">
    <h2>① 月を選ぶ</h2>
    <label for="month">対象の月</label>
    <input type="month" id="month">
  </section>

  <section class="step">
    <h2>② 休みの日をタップ</h2>
    <p class="hint" style="margin-top:0">色がついた日が「休業日」です。もう一度タップすると元に戻ります。</p>
    <div class="row">
      <button type="button" id="sundays">日曜日をすべて休みにする</button>
      <button type="button" id="clear">全部クリア</button>
    </div>
    <div class="grid" id="grid" aria-label="カレンダー"></div>
    <p class="count" id="count"></p>
  </section>

  <section class="step">
    <h2>③ Instagram用の画像を保存</h2>
    <label for="footer">画像の下に入れる文章（変更できます）</label>
    <input type="text" id="footer" value="営業時間 11:00-17:00 ／ 色のついた日は休業日です">
    <canvas id="preview" width="1080" height="1350"></canvas>
    <div class="row"><button type="button" class="primary" id="save">画像を保存する（PNG）</button></div>
    <p class="hint">保存した画像を Instagram に投稿してください（縦長 4:5 の投稿サイズです）。</p>
  </section>

  <section class="step">
    <h2>④ ホームページ用のデータをコピー</h2>
    <textarea id="json" readonly></textarea>
    <div class="row"><button type="button" class="primary" id="copy">コピーする</button></div>
    <p class="hint" id="copied" aria-live="polite">コピーしたら、LINE などで管理担当（鈴木さん）に送ってください。</p>
  </section>
</main>

<script>
(() => {
  const FONT = '"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif';
  const WD = ['月', '火', '水', '木', '金', '土', '日'];
  const $ = (id) => document.getElementById(id);
  const store = {}; // 月ごとの「休み」を覚えておく（月を切り替えても消えない）

  const pad = (n) => String(n).padStart(2, '0');
  const current = () => {
    const [y, m] = $('month').value.split('-').map(Number);
    const ym = `${y}-${pad(m)}`;
    store[ym] ??= new Set();
    const days = new Date(y, m, 0).getDate();
    const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7; // 月曜始まり
    return { y, m, ym, days, lead, closed: store[ym] };
  };
  const sortedClosed = (c) => [...c].sort((a, b) => a - b);

  function renderGrid() {
    const { days, lead, closed } = current();
    const grid = $('grid');
    grid.innerHTML = '';
    WD.forEach((w, i) => {
      const el = document.createElement('div');
      el.className = 'wd' + (i === 5 ? ' sat' : i === 6 ? ' sun' : '');
      el.textContent = w;
      grid.appendChild(el);
    });
    for (let i = 0; i < lead; i++) {
      const b = document.createElement('div'); b.className = 'blank'; grid.appendChild(b);
    }
    for (let d = 1; d <= days; d++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'day';
      btn.setAttribute('aria-pressed', closed.has(d) ? 'true' : 'false');
      btn.innerHTML = `${d}<small>${closed.has(d) ? '休' : ''}</small>`;
      btn.addEventListener('click', () => {
        closed.has(d) ? closed.delete(d) : closed.add(d);
        refresh();
      });
      grid.appendChild(btn);
    }
  }

  function renderJson() {
    const { ym, closed } = current();
    $('json').value = `"${ym}": { "published": true, "closed": [${sortedClosed(closed).join(', ')}] },`;
    $('count').textContent = `休業日：${closed.size}日（営業日：${current().days - closed.size}日）`;
  }

  function drawCanvas() {
    const { y, m, days, lead, closed } = current();
    const c = $('preview');
    const g = c.getContext('2d');
    const W = c.width, H = c.height;
    g.fillStyle = '#F8F5F7'; g.fillRect(0, 0, W, H);

    // 上の飾り帯
    g.fillStyle = '#C5B3D3'; g.fillRect(0, 0, W, 18);

    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = '#222';
    g.font = `700 76px ${FONT}`; g.fillText(`${y}年${m}月`, W / 2, 150);
    g.font = `500 40px ${FONT}`; g.fillText('営業カレンダー', W / 2, 215);
    g.fillStyle = '#6B4FA0'; g.font = `400 30px ${FONT}`; g.fillText('healing salon Holly', W / 2, 265);

    const left = 60, top = 310, cw = (W - left * 2) / 7, hh = 64, rh = 128;
    // 曜日
    WD.forEach((w, i) => {
      g.fillStyle = i === 5 ? '#2F5DA8' : i === 6 ? '#B33A3A' : '#333';
      g.font = `700 34px ${FONT}`;
      g.fillText(w, left + cw * i + cw / 2, top + 44);
    });
    // マス
    const cells = [...Array(lead).fill(null), ...Array.from({ length: days }, (_, i) => i + 1)];
    while (cells.length % 7) cells.push(null);
    const rows = cells.length / 7;
    for (let r = 0; r < rows; r++) {
      for (let col = 0; col < 7; col++) {
        const d = cells[r * 7 + col];
        const x = left + cw * col, yy = top + hh + rh * r;
        if (d === null) { g.fillStyle = '#F1EDF3'; g.fillRect(x, yy, cw, rh); }
        else {
          const isClosed = closed.has(d);
          g.fillStyle = isClosed ? '#DBD0E6' : '#FFFFFF';
          g.fillRect(x, yy, cw, rh);
          g.fillStyle = isClosed ? '#4A2D82' : '#222';
          g.font = `${isClosed ? 700 : 500} 46px ${FONT}`;
          g.fillText(String(d), x + cw / 2, yy + 62);
          if (isClosed) { g.fillStyle = '#6B4FA0'; g.font = `700 30px ${FONT}`; g.fillText('休', x + cw / 2, yy + 106); }
        }
        g.strokeStyle = '#BDB3C4'; g.lineWidth = 2; g.strokeRect(x, yy, cw, rh);
      }
    }
    // 曜日行の罫線
    g.strokeStyle = '#BDB3C4'; g.lineWidth = 2;
    for (let col = 0; col < 7; col++) g.strokeRect(left + cw * col, top, cw, hh);

    // 下の文章
    g.fillStyle = '#333'; g.font = `400 30px ${FONT}`;
    g.fillText($('footer').value, W / 2, H - 70);
  }

  function refresh() { renderGrid(); renderJson(); drawCanvas(); }

  // 初期値は「来月」
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  $('month').value = `${next.getFullYear()}-${pad(next.getMonth() + 1)}`;

  $('month').addEventListener('change', () => { if ($('month').value) refresh(); });
  $('footer').addEventListener('input', drawCanvas);
  $('sundays').addEventListener('click', () => {
    const { y, m, days, closed } = current();
    for (let d = 1; d <= days; d++) if (new Date(y, m - 1, d).getDay() === 0) closed.add(d);
    refresh();
  });
  $('clear').addEventListener('click', () => { current().closed.clear(); refresh(); });

  $('save').addEventListener('click', () => {
    const { ym } = current();
    $('preview').toBlob((blob) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `holly-calendar-${ym}.png`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
  });

  $('copy').addEventListener('click', async () => {
    const t = $('json');
    try { await navigator.clipboard.writeText(t.value); }
    catch { t.removeAttribute('readonly'); t.select(); document.execCommand('copy'); t.setAttribute('readonly', ''); }
    $('copied').textContent = 'コピーしました！ LINE などで管理担当（鈴木さん）に送ってください。';
  });

  // フォントが読み込まれてから画像を描き直す
  (document.fonts?.ready ?? Promise.resolve()).then(refresh);
  refresh();
})();
</script>
</body>
</html>
